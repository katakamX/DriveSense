[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "drivesense-ml"
version = "0.1.0"
description = "DriveSense offline ML pipeline — fetch, adapt, window, featurise, label, train"
requires-python = ">=3.12"
# Feature engineering is imported from the backend, never reimplemented here
# (ADR 0004). Install the backend editable alongside this package.
dependencies = [
    "drivesense-backend",
    "pandas>=2.2",
    "pyarrow>=17",
    "scikit-learn>=1.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "mypy>=1.13",
    "pandas-stubs>=2.2",
    "types-PyYAML>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["pipelines"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true

# scikit-learn ships no type information. Rather than let that leak `Any`
# through the pipeline, training code converts every estimator output to a
# concrete type at the boundary (`float(...)`, `str(...)`, `np.asarray(...)`)
# before it goes anywhere — and `pipelines.artifact`, the half the backend will
# import, does not depend on scikit-learn at all.
[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true
