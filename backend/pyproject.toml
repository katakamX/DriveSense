[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "drivesense-backend"
version = "0.1.0"
description = "DriveSense backend — telemetry ingest, event detection, risk scoring API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    # Inference only: `app.ml.artifact` evaluates the serialised coefficient
    # dump. No scikit-learn — the backend loads models, it does not fit them.
    "numpy>=1.26",
    # Browser-camera driver monitoring (`app.core.monitor`). Headless OpenCV:
    # this process decodes JPEGs, it never opens a window or a capture device
    # — that is `cv/`'s job, and it uses the GUI build for its debug preview.
    # Note these pull ~200 MB into every backend install; see the package
    # docstring in `app/core/monitor/__init__.py` for the ADR 0002 tension.
    "mediapipe>=1.0",
    "opencv-python-headless>=4.10",
    # Password hashing (app.core.security). Direct bcrypt, not passlib -
    # passlib is unmaintained and its bcrypt backend has version-detection
    # issues with recent bcrypt releases.
    "bcrypt>=4.2",
    # Required for pydantic's EmailStr (app.schemas.auth) - not pulled in by
    # the plain "pydantic" dependency above.
    "email-validator>=2.2",
    # Mailgun API calls for OTP email (app.core.mailgun). Already a transitive
    # dev/test dependency via the TestClient; needed at runtime too now.
    "httpx>=0.27",
    # Google OAuth login (M-Auth-2, app.core.oauth). Handles the
    # authorization-code exchange and CSRF state check rather than a
    # hand-rolled implementation.
    "authlib>=1.3",
    # SessionMiddleware, used only to hold Authlib's short-lived OAuth CSRF
    # state between the /google/login redirect and the /google/callback -
    # unrelated to the app's own DB-backed session cookie.
    "itsdangerous>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    # Milestone 9's exit criterion is "golden and property tests pass". The
    # risk engine's invariants — boundedness, monotonicity in severity, the
    # rule gate — are statements about *every* input, and a hand-written sweep
    # only ever checks the inputs their author already thought of.
    "hypothesis>=6.100",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Depends()/Query() as argument defaults is FastAPI's documented DI pattern,
# not the eager-call bug B008 exists to catch. Scoped to the router files so
# B008 keeps catching genuine mistakes elsewhere.
"app/api/**" = ["B008"]
# Same FastAPI DI pattern, this dependency just lives outside app/api since
# other dependencies (get_db) do too.
"app/core/deps.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true

# Neither package ships type stubs. Same override `cv/pyproject.toml` carries,
# for the same two libraries and the same reason.
[[tool.mypy.overrides]]
module = ["cv2.*", "mediapipe.*"]
ignore_missing_imports = true

# Authlib ships no stubs either (types-Authlib is third-party and stale).
[[tool.mypy.overrides]]
module = ["authlib.*"]
ignore_missing_imports = true
