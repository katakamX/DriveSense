# Production-oriented composition: built images, no source mounts, no exposed
# database port. `docker compose up --build` brings up the full stack.
# For development use docker-compose.dev.yml (see README).

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-drivesense}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-drivesense}
      POSTGRES_DB: ${POSTGRES_DB:-drivesense}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-drivesense} -d ${POSTGRES_DB:-drivesense}']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      target: production
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-drivesense}:${POSTGRES_PASSWORD:-drivesense}@db:5432/${POSTGRES_DB:-drivesense}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health').status==200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: production
    ports:
      - '${FRONTEND_PORT:-3000}:80'
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
