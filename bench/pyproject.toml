[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "drivesense-bench"
version = "0.1.0"
description = "M14 latency/throughput benchmark harness for DriveSense"
requires-python = ">=3.12"
dependencies = [
    # The receive side of the ingest -> browser latency measurement: a real
    # network WebSocket client against the deployed backend, not Starlette's
    # in-process TestClient the backend's own tests use.
    "websockets>=13.0",
    # The producer side (SimulatorTelemetrySource + HttpSink) and its
    # real-time frame pacing.
    "drivesense-simulator>=0.1.0",
    # `app.db.session` / `app.db.models` for direct trip-fixture setup (see
    # drivesense_bench/setup.py) -- reuses the backend's own schema and engine
    # rather than duplicating either.
    "drivesense-backend>=0.1.0",
]

[project.scripts]
drivesense-bench = "drivesense_bench.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7", "mypy>=1.13"]

[tool.hatch.build.targets.wheel]
packages = ["drivesense_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["drivesense_bench", "drivesense_contracts", "drivesense_sim", "app"]

[tool.mypy]
python_version = "3.12"
strict = true
